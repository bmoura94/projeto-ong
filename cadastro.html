<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- Configuração de codificação de caracteres para aceitar acentos -->
    <meta charset="UTF-8" />

    <!-- Responsividade para adaptação em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Folha de estilos externa -->
    <link rel="stylesheet" href="style.css" />

    <title>Cadastro de Voluntários - ONG</title>
  </head>
  <body>
    <!-- Cabeçalho principal com menu de navegação -->
    <header>
      <nav>
        <a href="index.html">Início</a>
        <a href="projetos.html">Projetos</a>
        <a href="cadastro.html">Cadastro</a>
      </nav>
    </header>
    <main>
      <section>
        <form>
          <!-- Grupo 1: Dados Pessoais -->
          <fieldset>
            <legend>Dados Pessoais</legend>

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" required /><br />

            <label for="nascimento">Data de nascimento:</label>
            <input
              type="date"
              id="nascimento"
              name="nascimento"
              required
            /><br />

            <label for="cpf">CPF:</label>
            <input
              type="text"
              id="cpf"
              name="cpf"
              placeholder="000.000.000-00"
              pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
              required
            /><br />
          </fieldset>

          <!-- Grupo 2: Contato e Endereço -->
          <fieldset>
            <legend>Contato e Endereço</legend>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required /><br />

            <label for="telefone">Telefone:</label>
            <input
              type="tel"
              id="telefone"
              name="telefone"
              placeholder="(00) 00000-0000"
              pattern="\(\d{2}\)\s\d{5}-\d{4}"
              required
            /><br />

            <label for="cep">CEP:</label>
            <input
              type="text"
              id="cep"
              name="cep"
              placeholder="00000-000"
              pattern="\d{5}-\d{3}"
              required
            /><br />
          </fieldset>

          <br />
          <button type="submit">Cadastrar</button>
          <div class="badges-container">
            <span class="badge badge-success">Cadastrado</span>
            <span class="badge badge-warning">Pendente</span>
            <span class="badge badge-error">Erro</span>
          </div>
        </form>
      </section>
    </main>
    <!-- Rodapé da página -->
    <footer>
      <p>&copy; 2026 ONG Ficticia. Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
